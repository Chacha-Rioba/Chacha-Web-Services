server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location /api/ { return 410; }
  location = /services/workflow-automation { return 301 /services/ai-agents-and-automation; }
  location ~ ^/(login|signup|verify|portal|admin|preview)(/|$) { return 301 /contact; }
  location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ /index.html; }
}
